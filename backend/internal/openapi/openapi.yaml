openapi: 3.1.0
info:
  title: TouchGal API
  version: v1
  description: Independent sanitized Galgame metadata API for developers.
servers:
  - url: http://localhost:8080
security:
  - ApiToken: []
components:
  securitySchemes:
    ApiToken:
      type: http
      scheme: bearer
      bearerFormat: tgal_live
    XApiToken:
      type: apiKey
      in: header
      name: X-API-Token
    CookieSession:
      type: apiKey
      in: cookie
      name: tgal_dev_session
  schemas:
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          properties:
            code: { type: string, enum: [BAD_REQUEST, REQUEST_BODY_TOO_LARGE, UNAUTHORIZED, FORBIDDEN, ACCOUNT_DISABLED, NOT_FOUND, CONFLICT, TOKEN_LIMIT_EXCEEDED, RATE_LIMITED, CODE_COOLDOWN, INVALID_CODE, EXPIRED_CODE, TURNSTILE_FAILED, TURNSTILE_UNAVAILABLE, NOT_READY, INTERNAL_ERROR] }
            message: { type: string }
    HealthResponse:
      type: object
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          properties:
            status: { type: string, example: ok }
            version: { type: string, example: v1 }
    ReadinessResponse:
      type: object
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          properties:
            status: { type: string, example: ready }
            version: { type: string, example: v1 }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        status: { type: string, enum: [active, disabled] }
        isAdmin: { type: boolean }
        minuteLimit: { type: integer, minimum: 1 }
        dailyLimit: { type: integer, minimum: 1 }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminUserPatch:
      type: object
      additionalProperties: false
      properties:
        status: { type: string, enum: [active, disabled] }
        email: { type: string, format: email, maxLength: 254 }
        displayName: { type: string, maxLength: 80 }
        minuteLimit: { type: integer, minimum: 1 }
        dailyLimit: { type: integer, minimum: 1 }
    Application:
      type: object
      properties:
        id: { type: string, format: uuid }
        applicantName: { type: string }
        projectName: { type: string }
        projectUrl: { type: string }
        expectedDailyRequests: { type: integer }
        usageScenario: { type: string }
        status: { type: string, enum: [pending, approved, rejected, revoked] }
        createdAt: { type: string, format: date-time }
        reviewedAt: { type: string, format: date-time }
    Token:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        tokenPrefix: { type: string }
        status: { type: string, enum: [active] }
        minuteLimit: { type: integer }
        dailyLimit: { type: integer }
        lastUsedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    Pagination:
      type: object
      required: [page, limit, total, hasMore]
      properties:
        page:
          type: integer
          minimum: 1
          maximum: 100
        limit:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        hasMore: { type: boolean }
    GameSearchItem:
      type: object
      properties:
        name: { type: string }
        uniqueId: { type: string, minLength: 8, maxLength: 8 }
    GameDetail:
      type: object
      properties:
        uniqueId: { type: string }
        name: { type: string }
        aliases: { type: array, items: { type: string } }
        introduction: { type: string }
        bannerUrl: { type: string }
        type: { type: array, items: { type: string } }
        platform: { type: array, items: { type: string } }
        language: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        publishTime: { type: string, format: date-time }
        releaseDate: { type: string }
        updatedAt: { type: string, format: date-time }
        resourceUpdateTime: { type: string, format: date-time }
        companies:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              aliases: { type: array, items: { type: string } }
        rating:
          type: object
          properties:
            average: { type: number }
            count: { type: integer }
            recommend:
              type: object
              properties:
                strongNo: { type: integer }
                no: { type: integer }
                neutral: { type: integer }
                yes: { type: integer }
                strongYes: { type: integer }
        touchgalUrl: { type: string }
    CodeStartResponse:
      type: object
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [sent, expiresInSeconds, resendCooldownSeconds]
          properties:
            sent: { type: boolean, const: true, description: Request accepted. A code is sent only when the email is eligible for this auth flow. }
            expiresInSeconds: { type: integer, minimum: 1, example: 600 }
            resendCooldownSeconds: { type: integer, minimum: 1, example: 60 }
  headers:
    XRateLimitLimitMinute:
      description: Effective per-minute request limit for the authenticated API token, user, or application scope.
      schema: { type: integer, minimum: 0 }
    XRateLimitRemainingMinute:
      description: Remaining requests in the current minute window for the tightest authenticated rate-limit scope.
      schema: { type: integer, minimum: 0 }
    XRateLimitLimitDay:
      description: Effective per-day request limit for the authenticated API token, user, or application scope.
      schema: { type: integer, minimum: 0 }
    XRateLimitRemainingDay:
      description: Remaining requests in the current day window for the tightest authenticated rate-limit scope.
      schema: { type: integer, minimum: 0 }
paths:
  /v1/health:
    get:
      security: []
      summary: Health check
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/HealthResponse' } } } }
  /v1/ready:
    get:
      security: []
      summary: Readiness check
      description: Checks clean PostgreSQL and Redis dependencies without touching the source database.
      responses:
        '200': { description: Ready, content: { application/json: { schema: { $ref: '#/components/schemas/ReadinessResponse' } } } }
        '503': { description: Not ready, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /v1/me:
    get:
      summary: API token self check
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '429':
          description: Rate limited. Token-authenticated /v1 responses include rate-limit headers.
          headers:
            X-RateLimit-Limit-Minute: { $ref: '#/components/headers/XRateLimitLimitMinute' }
            X-RateLimit-Remaining-Minute: { $ref: '#/components/headers/XRateLimitRemainingMinute' }
            X-RateLimit-Limit-Day: { $ref: '#/components/headers/XRateLimitLimitDay' }
            X-RateLimit-Remaining-Day: { $ref: '#/components/headers/XRateLimitRemainingDay' }
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /v1/games/search:
    get:
      summary: Search sanitized games
      parameters:
        - { name: keyword, in: query, schema: { type: string, minLength: 3, maxLength: 100 } }
        - { name: q, in: query, schema: { type: string, minLength: 3, maxLength: 100 } }
        - { name: page, in: query, description: 'Offset page. Maximum 100; cursor pagination is not available, so use narrower keywords instead of deep crawling.', schema: { type: integer, minimum: 1, maximum: 100, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/GameSearchItem' } }
                      pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '429':
          description: Rate limited. Token-authenticated /v1 responses include rate-limit headers.
          headers:
            X-RateLimit-Limit-Minute: { $ref: '#/components/headers/XRateLimitLimitMinute' }
            X-RateLimit-Remaining-Minute: { $ref: '#/components/headers/XRateLimitRemainingMinute' }
            X-RateLimit-Limit-Day: { $ref: '#/components/headers/XRateLimitLimitDay' }
            X-RateLimit-Remaining-Day: { $ref: '#/components/headers/XRateLimitRemainingDay' }
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /v1/games/{uniqueId}:
    get:
      summary: Get sanitized game detail
      parameters:
        - { name: uniqueId, in: path, required: true, schema: { type: string, minLength: 8, maxLength: 8 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, data: { $ref: '#/components/schemas/GameDetail' } } } } } }
        '404': { description: Not found }
        '429':
          description: Rate limited. Token-authenticated /v1 responses include rate-limit headers.
          headers:
            X-RateLimit-Limit-Minute: { $ref: '#/components/headers/XRateLimitLimitMinute' }
            X-RateLimit-Remaining-Minute: { $ref: '#/components/headers/XRateLimitRemainingMinute' }
            X-RateLimit-Limit-Day: { $ref: '#/components/headers/XRateLimitLimitDay' }
            X-RateLimit-Remaining-Day: { $ref: '#/components/headers/XRateLimitRemainingDay' }
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /auth/register/start:
    post:
      security: []
      summary: Start email-code registration
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email, displayName, turnstileToken], properties: { email: { type: string, format: email }, displayName: { type: string }, turnstileToken: { type: string, minLength: 1, maxLength: 2048, description: Cloudflare Turnstile response token } } } } }
      responses:
        '200':
          description: Request accepted. A code is sent only when the email is not already registered.
          content: { application/json: { schema: { $ref: '#/components/schemas/CodeStartResponse' } } }
        '429':
          description: Code resend cooldown or auth start rate limit
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '400':
          description: Turnstile failed
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '503':
          description: Turnstile unavailable
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /auth/register/verify:
    post:
      security: []
      summary: Verify registration code and set HttpOnly session cookie
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email, code], properties: { email: { type: string }, code: { type: string, minLength: 6, maxLength: 6 } } } } }
      responses:
        '200': { description: Current user }
        '400':
          description: Invalid or expired verification code
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /auth/login/start:
    post:
      security: []
      summary: Start email-code login
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email, turnstileToken], properties: { email: { type: string, format: email }, turnstileToken: { type: string, minLength: 1, maxLength: 2048, description: Cloudflare Turnstile response token } } } } }
      responses:
        '200':
          description: Request accepted. A code is sent only when the email belongs to an existing account.
          content: { application/json: { schema: { $ref: '#/components/schemas/CodeStartResponse' } } }
        '429':
          description: Code resend cooldown or auth start rate limit
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '400':
          description: Turnstile failed
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '503':
          description: Turnstile unavailable
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /auth/login/verify:
    post:
      security: []
      summary: Verify login code and set HttpOnly session cookie
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email, code], properties: { email: { type: string }, code: { type: string } } } } }
      responses:
        '200': { description: Current user }
        '400':
          description: Invalid or expired verification code
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /auth/logout:
    post:
      security: []
      summary: Revoke current session
      responses: { '200': { description: Logged out } }
  /auth/me:
    get:
      security: []
      summary: Current session user
      responses: { '200': { description: Current user }, '401': { description: Login required } }
  /admin/users:
    get:
      security:
        - CookieSession: []
      summary: List developer portal users for administrators
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, disabled] } }
        - { name: q, in: query, schema: { type: string, maxLength: 160 }, description: Search email or display name }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        '400': { description: Invalid filters, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { description: Login required, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: Admin required, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /admin/users/{id}:
    patch:
      security:
        - CookieSession: []
      summary: Update a developer portal user's profile, status, or rate limits
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserPatch' }
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/User' }
        '400': { description: Invalid profile, limits, status, or unsafe self-disable, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { description: Login required, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: Admin required, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: User not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: Email already exists, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    delete:
      security:
        - CookieSession: []
      summary: Delete a developer portal user
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    properties:
                      deleted: { type: boolean, const: true }
        '400': { description: Invalid user id or unsafe self-delete, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { description: Login required, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: Admin required, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: User not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /applications:
    get:
      security: []
      summary: List current user's applications
      responses: { '200': { description: OK } }
    post:
      security: []
      summary: Submit one-time account API application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applicantName, projectUrl, expectedDailyRequests, usageScenario]
              properties:
                applicantName: { type: string }
                projectName: { type: string }
                projectUrl: { type: string, format: uri }
                expectedDailyRequests: { type: integer, minimum: 1 }
                usageScenario: { type: string }
      responses: { '201': { description: Created }, '409': { description: Account already has an application } }
  /tokens:
    get:
      security: []
      summary: List current user's API tokens without plaintext or hash
      responses: { '200': { description: OK } }
    post:
      security: []
      summary: Create API token for approved account or admin user; plaintext is returned once; active token count is capped per user
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } }
      responses: { '201': { description: Token created }, '409': { description: Active token limit exceeded } }
  /tokens/{id}:
    patch:
      security: []
      summary: Update current user's API token name
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 100 } } } } }
      responses: { '200': { description: Token updated }, '400': { description: Invalid token name }, '404': { description: Token not found } }
    delete:
      security: []
      summary: Delete current user's API token; invalidated token records are removed instead of retained
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Token deleted }, '404': { description: Token not found } }
  /dashboard/stats:
    get:
      security: []
      summary: Dashboard stats summary, trend, sources, and endpoint rollups
      parameters:
        - name: days
          in: query
          description: Dashboard window in days. Values above 90 are normalized to 90 by the backend.
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
        - { name: tokenId, in: query, schema: { type: string, format: uuid } }
      responses: { '200': { description: OK } }
