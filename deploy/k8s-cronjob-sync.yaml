apiVersion: batch/v1
kind: CronJob
metadata:
  name: touchgal-developer-sync
spec:
  schedule: "*/30 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: touchgal-developer-backend:latest
              command: ["touchgal-sync", "--mode=incremental"]
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              envFrom:
                - secretRef:
                    name: touchgal-developer-backend-env
      activeDeadlineSeconds: 3600
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
  concurrencyPolicy: Forbid
