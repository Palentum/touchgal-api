events {
}

http {
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from ::1;
  set_real_ip_from fc00::/7;
  set_real_ip_from fe80::/10;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types application/javascript application/json application/openapi+yaml application/xml image/svg+xml text/css text/javascript text/plain text/xml;

  upstream touchgal_backend {
    server backend:8080;
    keepalive 16;
  }

  upstream touchgal_frontend {
    server frontend:3000;
    keepalive 16;
  }

  server {
    listen 80;
    server_name developer.example.com;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
      client_max_body_size 128k;
      client_body_timeout 15s;
      proxy_connect_timeout 3s;
      proxy_send_timeout 15s;
      proxy_read_timeout 65s;
      limit_req zone=api_per_ip burst=60 nodelay;
      limit_conn conn_per_ip 20;
      proxy_pass http://touchgal_backend/;
      add_header Cache-Control "no-store" always;
    }

    location ^~ /_nuxt/ {
      proxy_pass http://touchgal_frontend;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /logo.webp {
      proxy_pass http://touchgal_frontend;
      add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }

    location / {
      proxy_connect_timeout 3s;
      proxy_send_timeout 15s;
      proxy_read_timeout 65s;
      proxy_pass http://touchgal_frontend;
    }
  }
}
