services:
  backend:
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../frontend
    env_file:
      - ../frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
