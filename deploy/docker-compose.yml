services:
  backend:
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/v1/ready >/dev/null"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    cpus: "1.0"
    mem_limit: 512m
    pids_limit: 256

  frontend:
    build:
      context: ../frontend
    env_file:
      - ../frontend/.env
    environment:
      NUXT_API_BASE_URL: ${NUXT_API_BASE_URL:-http://backend:8080}
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 128
